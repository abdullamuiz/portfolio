<style>
.hc-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-4px 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line)}

/* greeting intro (standalone link) */

</style>
